name: Deterministic Quality Gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch hygiene
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          else
            git show --format= --check HEAD
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax integrity
        run: python -m py_compile calculo_prn17.py
      - name: RINEX sample fixture
        run: test -s Modified_RINEX_I2.rnx
